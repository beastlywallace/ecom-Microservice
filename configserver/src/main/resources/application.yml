spring:
  application:
    name: configserver
  profiles:
    active: native
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
  cloud:
    bus:
      enabled: true
      refresh:
        enabled: true
    config:
      server:
        native:
          search-locations: classpath:/config


server:
  port: 8888

management:
  endpoints:
    web:
      exposure:
        include: "*"