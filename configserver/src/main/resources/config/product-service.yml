spring:

  datasource:
    url: jdbc:postgresql://localhost:5432/product
    username: postgres
    password: postgres

  jpa:
    database: POSTGRESQL
    show-sql: true
    hibernate:
      ddl-auto: update
    #    database-platform: org.hibernate.dialect.MySQLDialect
    database-platform: org.hibernate.dialect.PostgreSQLDialect

    properties:
      hibernate:
        format_sql: true
#        dialect: org.hibernate.dialect.mySQLDialect

server:
  port: 8081