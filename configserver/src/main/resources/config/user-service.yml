spring:
    data:
        mongodb:
            uri: ${MONGO_URI}
            database: ecom_user
    rabbitmq:
        host: localhost
        port: 5672
        username: guest
        password: guest



server:
    port: 8082

management:
    endpoints:
        web:
            exposure:
                include: "*"


eureka:
    instance:
        prefer-ip-address: true
    client:
        serviceUrl:
            defaultZone: http://localhost:8761/eureka/
        register-with-eureka: true
        fetch-registry: true
